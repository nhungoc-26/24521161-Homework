<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drum Kit Engine</title>
  </head>
  <body>
    <main>
      <h1>Drum Kit</h1>

      <section id="drum-kit" aria-label="Drum kit">
        <button class="drum-pad" data-sound="kick">Kick</button>

        <button class="drum-pad" data-sound="snare">Snare</button>

        <button class="drum-pad" data-sound="hihat">Hi-Hat</button>

        <button class="drum-pad" data-sound="tom">Tom</button>

        <button class="drum-pad" data-sound="clap">Clap</button>

        <button class="drum-pad" data-sound="crash">Crash</button>
      </section>
    </main>
    <script src="audio.js"></script>
    <script src="recorder.js"></script>
    <script src="input.js"></script>
  </body>
</html>
