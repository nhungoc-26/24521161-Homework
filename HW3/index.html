<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resilient Landing Page</title>
  </head>

  <body>
    <main>
      <section aria-labelledby="hero-title">
        <h1 id="hero-title">Something Great Is Coming</h1>
        <p>Stay tuned for our launch.</p>

        <div id="countdown" aria-live="polite">
          <span id="days">0</span> days <span id="hours">0</span> hours
          <span id="minutes">0</span> minutes
          <span id="seconds">0</span> seconds
        </div>
      </section>

      <section aria-labelledby="signup-title">
        <h2 id="signup-title">Join the Waitlist</h2>

        <form id="signup-form">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          />

          <button type="submit" id="submit-button">Join Waitlist</button>

          <p id="form-message" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
